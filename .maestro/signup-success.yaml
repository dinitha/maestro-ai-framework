appId: com.wdiodemoapp
name: Signup accepts valid details
---
- launchApp:
    clearState: true
- tapOn: Login
- tapOn:
    id: button-sign-up-container
- tapOn:
    id: input-email
- inputText: maestro.signup@example.com
- tapOn:
    id: input-password
- inputText: TestPass123
- tapOn:
    id: input-repeat-password
- inputText: TestPass123
- tapOn:
    id: button-SIGN UP
- assertVisible: You successfully signed up!

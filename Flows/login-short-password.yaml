appId: com.wdiodemoapp
name: Login rejects password shorter than eight characters
---
- launchApp:
    clearState: true
- tapOn:
    text: Login
    index: 0
- tapOn: Email
- inputText: short.password@example.com
- tapOn: Password
- inputText: short7
- hideKeyboard
- tapOn: button-LOGIN
- assertNotVisible: Success
- assertVisible: button-LOGIN

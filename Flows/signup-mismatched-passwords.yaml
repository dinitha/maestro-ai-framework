appId: com.wdiodemoapp
name: Signup rejects mismatched passwords
---
- launchApp:
    clearState: true
- tapOn:
    text: Login
    index: 0
- tapOn: Sign up
- tapOn: Email
- inputText: mismatch.signup@example.com
- tapOn: Password
- inputText: TestPass123
- tapOn: Confirm password
- inputText: OtherPass456
- hideKeyboard
- tapOn: button-SIGN UP
- assertNotVisible: Signed Up!

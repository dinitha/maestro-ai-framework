appId: com.wdiodemoapp
name: Signup rejects invalid email
---
- launchApp:
    clearState: true
- tapOn:
    text: Login
    index: 0
- tapOn: Sign up
- tapOn: Email
- inputText: not-an-email
- tapOn: Password
- inputText: TestPass123
- tapOn: Confirm password
- inputText: TestPass123
- hideKeyboard
- tapOn: button-SIGN UP
- assertNotVisible: Signed Up!
